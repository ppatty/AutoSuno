<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/static/manifest.json">
    <title>Shift Pocket Logger</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 { margin: 0 0 6px; font-size: 1.9rem; }
        .subtitle { margin: 0 0 18px; color: #94a3b8; }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        label { display: block; font-size: 0.88rem; margin-bottom: 5px; color: #cbd5e1; }
        input, select, textarea {
            width: 100%;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 8px;
            padding: 10px;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        textarea { min-height: 90px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .primary { background: #22c55e; color: #052e16; }
        .task {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: baseline;
        }
        .pill {
            font-size: 0.75rem;
            border-radius: 999px;
            padding: 2px 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #334155;
            color: #cbd5e1;
        }
        .status-done { opacity: 0.6; }
        .task-meta { color: #94a3b8; font-size: 0.82rem; margin-top: 5px; }
        .task-actions { margin-top: 8px; }
        .task-actions button { background: #38bdf8; color: #082f49; }
        .muted { color: #94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Shift Pocket Logger</h1>
    <p class="subtitle">Capture swaps, unavailability, and quick rostering tasks before you forget.</p>

    <section class="card">
        <form id="taskForm">
            <label for="staffName">Team Member</label>
            <input id="staffName" name="staff_name" placeholder="e.g. Alex" required>

            <div class="row">
                <div>
                    <label for="taskType">Request Type</label>
                    <select id="taskType" name="task_type" required>
                        <option value="swap">Shift Swap</option>
                        <option value="unavailable">Unavailable Day</option>
                        <option value="other">Other Rostering Task</option>
                    </select>
                </div>
                <div>
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="normal">Normal</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>

            <label for="shiftDate">Date (optional)</label>
            <input id="shiftDate" name="shift_date" type="date">

            <label for="detail">Details</label>
            <textarea id="detail" name="detail" placeholder="What exactly needs changing?" required></textarea>

            <button class="primary" type="submit">Save Request</button>
        </form>
    </section>

    <section class="card">
        <h2 style="margin-top:0;">Open Items</h2>
        <div id="taskList"></div>
    </section>
</div>

<script>
const taskList = document.getElementById('taskList');
const form = document.getElementById('taskForm');

function formatType(type) {
    return {
        swap: 'Shift Swap',
        unavailable: 'Unavailable',
        other: 'Other'
    }[type] || type;
}

function render(tasks) {
    if (!tasks.length) {
        taskList.innerHTML = '<p class="muted">No tasks yet. Add your first request above.</p>';
        return;
    }

    taskList.innerHTML = tasks.map(task => `
        <article class="task ${task.status === 'done' ? 'status-done' : ''}">
            <div class="task-header">
                <strong>${task.staff_name}</strong>
                <span class="pill">${task.priority}</span>
            </div>
            <div>${formatType(task.task_type)}${task.shift_date ? ` · ${task.shift_date}` : ''}</div>
            <div>${task.detail}</div>
            <div class="task-meta">Logged ${task.created_at.replace('T', ' ').replace('Z', ' UTC')} · Status: ${task.status}</div>
            ${task.status === 'open' ? `<div class="task-actions"><button onclick="markDone(${task.id})">Mark Done</button></div>` : ''}
        </article>
    `).join('');
}

async function loadTasks() {
    const response = await fetch('/api/tasks');
    const data = await response.json();
    render(data.tasks || []);
}

async function markDone(taskId) {
    await fetch(`/api/tasks/${taskId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'done' })
    });
    await loadTasks();
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = Object.fromEntries(new FormData(form).entries());

    const response = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
    });

    const data = await response.json();
    if (!data.success) {
        alert(data.error || 'Could not save task.');
        return;
    }

    form.reset();
    document.getElementById('priority').value = 'normal';
    document.getElementById('taskType').value = 'swap';
    await loadTasks();
});

loadTasks();
</script>
</body>
</html>
